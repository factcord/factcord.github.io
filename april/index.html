<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRIL</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .book {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
            padding: 80px 20px;
        }

        .book img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <main class="book">
        <img src="assets/aprilcover.jpg" alt="April cover">

        <img src="assets/april1.jpg" alt="April page 1">
        <img src="assets/april2.jpg" alt="April page 2">
        <img src="assets/april3.jpg" alt="April page 3">
        <img src="assets/april4.jpg" alt="April page 4">
        <img src="assets/april5.jpg" alt="April page 5">
        <img src="assets/april6.jpg" alt="April page 6">
        <img src="assets/april7.jpg" alt="April page 7">
        <img src="assets/april8.jpg" alt="April page 8">
        <img src="assets/april9.jpg" alt="April page 9">
        <img src="assets/april10.jpg" alt="April page 10">
    </main>

</body>
</html>
